name: base
channels:
  - conda-forge
dependencies:
  - python=3.13.12
  - r-base=4.5.3
  - r-markdown=2.0
  - pandoc=3.9.0.2
  # R "recommended" packages - shipped by every CRAN distribution of R but
  # absent here because conda-forge r-base is built with
  # --with-recommended-packages=no
  - r-boot
  - r-class
  - r-cluster
  - r-codetools
  - r-foreign
  - r-kernsmooth
  - r-mass
  - r-mgcv
  - r-nlme
  - r-nnet
  - r-rpart
  - r-spatial
  - r-survival
