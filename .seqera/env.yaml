name: base
channels:
  - conda-forge
dependencies:
  - python=3.13.12
  - r-base=4.5.3
  - r-rmarkdown=2.32
  - r-knitr=1.52
  # RStudio's Knit button refuses to run until these are installed, although
  # rmarkdown itself does not depend on them
  - r-stringi=1.8.9
  - r-stringr=1.6.0
  - pandoc=3.9.0.2
  # R "recommended" packages - shipped by every CRAN distribution of R but
  # absent here because conda-forge r-base is built with
  # --with-recommended-packages=no
  - r-boot
  - r-class
  - r-cluster
  - r-codetools
  - r-foreign
  - r-kernsmooth
  - r-mass
  - r-mgcv
  - r-nlme
  - r-nnet
  - r-rpart
  - r-spatial
  - r-survival
